[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vera"
version = "1.0.0"
description = "VeRA: multi-level math augmentation pipeline (vera-E, vera-H, vera-H Pro)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Your Team"}]
dependencies = [
    "datasets>=2.18.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
